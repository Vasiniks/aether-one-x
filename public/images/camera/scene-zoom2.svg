<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#1a2940"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cfe8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8cfe8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#b8cfe8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="win" width="40" height="52" patternUnits="userSpaceOnUse">
      <rect width="40" height="52" fill="none"/>
      <rect x="6" y="8" width="12" height="16" rx="1" fill="#ffd9a0" opacity="0.9"/>
      <rect x="22" y="8" width="12" height="16" rx="1" fill="#9fc6ff" opacity="0.55"/>
      <rect x="6" y="30" width="12" height="16" rx="1" fill="#ffcf8d" opacity="0.65"/>
      <rect x="22" y="30" width="12" height="16" rx="1" fill="#ffd9a0" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="900" height="900" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="140" cy="70" r="1.1" opacity="0.7"/>
    <circle cx="360" cy="110" r="1" opacity="0.5"/>
    <circle cx="700" cy="60" r="1.2" opacity="0.6"/>
  </g>
  <g>
    <rect x="20" y="330" width="150" height="570" fill="#0a0e15"/>
    <rect x="20" y="330" width="150" height="570" fill="url(#win)" opacity="0.5"/>
    <rect x="180" y="240" width="220" height="660" fill="#0e1420"/>
    <rect x="180" y="240" width="220" height="660" fill="url(#win)" opacity="0.8"/>
    <rect x="410" y="300" width="170" height="600" fill="#0a0e15"/>
    <rect x="410" y="300" width="170" height="600" fill="url(#win)" opacity="0.55"/>
    <rect x="590" y="200" width="290" height="700" fill="#0f1521"/>
    <rect x="590" y="200" width="290" height="700" fill="url(#win)" opacity="0.7"/>
  </g>
  <rect y="330" width="900" height="300" fill="url(#haze)"/>
  <circle cx="170" cy="640" r="22" fill="#9fc6ff" opacity="0.12"/>
  <circle cx="730" cy="700" r="28" fill="#9fc6ff" opacity="0.1"/>
