<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d9dce3"/>
      <stop offset="0.3" stop-color="#9aa0ac"/>
      <stop offset="0.62" stop-color="#5a5e68"/>
      <stop offset="1" stop-color="#24262c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.24" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.1"/>
