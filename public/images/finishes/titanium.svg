    <pattern id="brush" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.4"/>
      <line x1="7" y1="0" x2="7" y2="14" stroke="#31343c" stroke-opacity="0.07" stroke-width="1.4"/>
